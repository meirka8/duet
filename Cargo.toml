[workspace]
resolver = "2"
members = [
    "crates/duet-types",
    "crates/duet-vfs",
    "crates/duet-ops",
    "crates/duet-index",
    "crates/duet-search",
    "crates/duet-meta",
    "crates/duet-commands",
    "crates/duet-config",
    "crates/duet-plugin",
    "crates/duet-platform",
    "crates/duet-widgets",
    "crates/duet-ui",
    "crates/duet",
    "helpers/duet-privileged",
    "plugins-sdk",
    "plugins-sdk/examples/stub-plugin",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.81.0"
license = "MIT"
authors = ["Duet Team"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
futures = "0.3"
thiserror = "1.0"
bitflags = "2.6"
proptest = "1.4"
libc = "0.2"
rustix = { version = "0.38", features = ["fs", "std"] }
gpui = "0.2.2"
gpui-component = "0.5.1"
criterion = { version = "0.5", features = ["async_tokio"] }
tempfile = "3.10"
log = "0.4"
async-trait = "0.1"
tokio-stream = "0.1"
toml = "0.8"
